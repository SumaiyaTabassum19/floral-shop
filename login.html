<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Canvas | Sign Up</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="signup-container">
        <div class="form-box">
            <h2><i class="fa-solid fa-seedling"></i> Create Account</h2>
            <p>Join Flower Canvas and let your love for flowers blossom.</p>

            <form id="signupForm">
                <div class="input-box">
                    <input type="text" id="username" placeholder="Full Name" required>
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="input-box">
                    <input type="email" id="email" placeholder="Email Address" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="input-box">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="input-box">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <button type="submit" class="btn">Sign Up</button>
            </form>

            <p class="login-link">Already have an account? <a href="signup.html">Login here</a></p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
